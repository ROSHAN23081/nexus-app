  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x;letter-spacing:.06em;}\n/* Messages */\n.msg-row{display:flex;margin-bottom:2px;animation:msgIn .28s var(--ease);}\n@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.97);}to{opacity:1;transform:none;}}\n.msg-row.sent{justify-content:flex-end;}\n.msg-row.recv{justify-content:flex-start;}\n.msg-row.sent + .msg-row.recv,\n.msg-row.recv + .msg-row.sent{margin-top:8px;}\n/* Bubble */\n.bubble{max-width:65%;padding:8px 12px 6px;border-radius:12px;position:relative;word-break:break-word;}\n.bubble-text{font-size:13.5px;line-height:1.55;color:var(--text-b);}\n.msg-row.sent .bubble{background:rgba(201,174,126,.18);border:1px solid rgba(201,174,126,.25);border-bottom-right-radius:3px;color:var(--text);}\n.msg-row.recv .bubble{background:var(--bg-alt);border:1px solid var(--border);border-bottom-left-radius:3px;}\n/* Tail */\n.msg-row.sent .bubble::after{content:'';position:absolute;bottom:0;right:-6px;width:0;height:0;border-top:6px solid transparent;border-bottom:0px solid transparent;border-left:7px solid rgba(201,174,126,.25);}\n.msg-row.recv .bubble::after{content:'';position:absolute;bottom:0;left:-6px;width:0;height:0;border-top:6px solid transparent;border-bottom:0px solid transparent;border-right:7px solid var(--border);}\n/* Message meta */\n.msg-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:3px;}\n.msg-time{font-family:var(--mono);font-size:10px;color:var(--text-f);}\n.msg-ticks{font-size:12px;line-height:1;}\n.msg-ticks.sent{color:var(--text-f);}\n.msg-ticks.delivered{color:var(--text-m);}\n.msg-ticks.read{color:#53bdeb;}\n/* Image bubble */\n.bubble-img{width:200px;height:150px;border-radius:8px;object-fit:cover;display:block;margin-bottom:4px;cursor:pointer;}\n/* Voice note */\n.voice-note{display:flex;align-items:center;gap:8px;padding:2px 0;}\n.vn-play{width:32px;height:32px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--bg acity:0;}\n.igmodal{background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--r4);padding:28px;width:500px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;transition:all .45s var(--ease);}\n.igmodal::before{content:'';position:absolute;top:0;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.45;}\n.ig-canvas{width:100%;height:280px;background:var(--bg-sec);border:1px solid var(--border);border-radius:var(--r3);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px;position:relative;}\n.ig-canvas img{width:100%;height:100%;object-fit:cover;}\n.ig-empty{font-size:13px;color:var(--text-m);}\n.ig-inp{width:100%;padding:10px 14px;margin-bottom:10px;background:var(--bg-sec);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-size:13px;outline:none;transition:all .28s;}\n.ig-inp:focus{border-color:var(--gold);}\n.ig-inp::placeholder{color:var(--text-f);}\n.btn-row{display:flex;gap:8px;}\n.gbtn{flex:1;padding:11px;border:none;border-radius:var(--r2);background:var(--text);color:var(--bg);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:6px;}\n[data-theme=\"light\"] .gbtn{color:#FDFAF5;}\n.gbtn:hover{opacity:.85;transform:translateY(-1px);}\n.gbtn.sec{background:var(--bg-sec);border:1px solid var(--border);color:var(--text-m);}\n.gbtn.sec:hover{border-color:var(--text-m);color:var(--text);}\n\n/* BIN */\n.bin-shell{width:100vw;height:100vh;display:flex;flex-direction:column;padding:13px;gap:10px;}\n.bin-head{height:58px;background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--r4);display:flex;align-items:center;padding:0 22px;gap:12px;}\n.bin-body{flex:1;background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--r4);padding:24px;display:flex;align-items:center;justify-c       <ellipse cx=\"137\" cy=\"316\" rx=\"20\" ry=\"14\" fill=\"url(#chromeLimb)\"><\u002Fellipse>\n                <ellipse cx=\"137\" cy=\"316\" rx=\"13\" ry=\"8\" fill=\"#020810\" stroke=\"#2060a0\" stroke-width=\".8\"><\u002Fellipse>\n                <circle cx=\"137\" cy=\"316\" r=\"4\" fill=\"#00d4ff\" opacity=\".45\" filter=\"url(#softGlow)\"><\u002Fcircle>\n                <path d=\"M 116 330 Q 112 340 112 350 L 112 370 Q 112 378 119 380 L 153 380 Q 160 378 160 370 L 160 350 Q 160 340 156 330 Z\" fill=\"url(#chromeLimb)\"><\u002Fpath>\n                <path d=\"M 108 385 Q 106 390 106 394 L 170 394 L 170 385 Q 137 381 108 385 Z\" fill=\"url(#chromeLimb)\"><\u002Fpath>\n              <\u002Fg>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div id=\"robot-name-badge\" style=\"position:relative;z-index:10;font-family:var(--mono);font-size:9.5px;color:rgba(74,158,255,.4);letter-spacing:.18em;text-transform:uppercase;margin-top:4px;text-align:center;padding-bottom:8px;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ai-input-bar\">\n          <div class=\"ai-irow\">\n            <button class=\"ai-ib ai-ib-mic\" id=\"ai-mic-btn\" onclick=\"toggleAiMic()\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z\"><\u002Fpath><path d=\"M19 10v2a7 7 0 0 1-14 0v-2\"><\u002Fpath><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"22\"><\u002Fline><\u002Fsvg>\n            <\u002Fbutton>\n            <div class=\"ai-iwrap\">\n              <textarea class=\"ai-cta\" id=\"ai-ta\" placeholder=\"Ask anything — I will respond vocally…\" rows=\"1\" onkeydown=\"aiKey(event)\" oninput=\"autoResize(this)\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <button class=\"ai-ib ai-ib-send\" onclick=\"sendAI()\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"22\" y1=\"2\" x2=\"11\" y2=\"13\"><\u002Fline><polygon points=\"22 2 15 22 11 13 2 9 22 2\"><\u002Fpolygon><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- MESSENGER PANEL -->\n      <div class=\"panel hidden\" id=\"p-msg\" style=\"flex-direction:row;overflow:hidden;\">\n        <div class=\"cp\">\n          <div class=\"cp-head\">\n            <div class=\"cp-toprow\">\n              <div class=\"cp-title\">Messages<\u002Fdiv>\n              <button class=\"t-btn\" onclick=\"switchPanel('home')\" style=\"font-size:10px;padding:4px 8px;\" id=\"msg-back-btn\"><\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"search-wrap\">\n              <input class=\"cp-search\" type=\"text\" placeholder=\"Search contacts…\" oninput=\"filterContacts(this.value)\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"cp-list\" id=\"clist\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cc\" id=\"chat-main\">\n          <div class=\"no-chat\" id=\"no-chat-state\">\n            <div class=\"no-chat-ico\" id=\"no-chat-ico\"><\u002Fdiv>\n            <div class=\"no-chat-title\">Select a conversation<\u002Fdiv>\n            <div class=\"no-chat-sub\">PIN-protected end-to-end encrypted<\u002Fdiv>\n          <\u002Fdiv>\n          <div id=\"chat-active\" class=\"hidden\" style=\"display:flex;flex-direction:column;height:100%;overflow:hidden;\">\n            <div class=\"cc-head\">\n              <div class=\"cc-av\" id=\"cz-av\"><\u002Fdiv>\n              <div style=\"flex:1;min-width:0;\">\n                <div id=\"cz-name\" class=\"cc-name\">—<\u002Fdiv>\n                <div id=\"cz-status\" class=\"cc-status\">—<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"cc-actions\">\n                <button class=\"cc-btn\" id=\"cc-search-btn\" title=\"Search\"><\u002Fbutton>\n                <button class=\"cc-btn\" id=\"cc-more-btn\" title=\"More\"><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"chat-area\" id=\"msg-body\"><\u002Fdiv>\n            <div class=\"ibar\">\n              <div class=\"chip-row\" id=\"msg-chips\"><\u002Fdiv>\n              <div class=\"irow\">\n                <button class=\"ib ib-ghost\" id=\"msg-emoji-btn\" title=\"Emoji\"><\u002Fbutton>\n                <label class=\"ib ib-ghost\" title=\"Attach\" style=\"cursor:pointer;\">\n                  <span id=\"attach-msg-ico\"><\u002Fspan>\n                  <input type=\"file\" id=\"msg-file\" multiple=\"\" accept=\"image/*,.pdf,.txt\" onchange=\"handleMsgFile(this)\" style=\"display:none;\">\n                <\u002Flabel>\n                <div class=\"iwrap\">\n                  <textarea class=\"cta\" id=\"msg-ta\" placeholder=\"Message…\" rows=\"1\" onkeydown=\"msgKey(event)\" oninput=\"autoResize(this);showTyping()\"><\u002Ftextarea>\n                <\u002Fdiv>\n                <button class=\"ib ib-ghost\" id=\"msg-voice-btn\" title=\"Voice note\" onclick=\"toggleVoiceNote()\"><\u002Fbutton>\n                <button class=\"ib ib-send\" id=\"msg-send-btn\" onclick=\"sendMsg()\"><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- BIN -->\n<div class=\"page out\" id=\"page-bin\">\n  <div class=\"bin-shell\">\n    <div class=\"bin-head\">\n      <button class=\"t-btn\" onclick=\"goPage('main')\" id=\"bin-back-btn\"><\u002Fbutton>\n      <div style=\"font-family:var(--display);font-size:15px;font-weight:600;flex:1;padding-left:10px;\">Recycle Bin<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"bin-body\">\n      <div class=\"empty-state\">\n        <div class=\"empty-ico\" id=\"bin-ico\"><\u002Fdiv>\n        <div class=\"empty-title\">The bin is empty<\u002Fdiv>\n        <div class=\"empty-sub\">No deleted items<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n'use strict';\n\n// ══════════════════════════════════════════════\n//  STATE\n// ══════════════════════════════════════════════\nlet isDark = true;\nlet currentUser = null;\nlet msgUnlocked = false, pinBuf = '';\nlet regPinBuf = '', regStep = 0;\nlet regData = {};\nlet msgCount = 0, sessionStart = Date.now();\nlet currentContact = null;\nlet isAiProcessing = false;\nlet isListening = false, recognition = null;\nlet currentUtterance = null;\nlet mouthTick = null, limbTick = null, gesturePhase = 0;\nlet conversationHistory = [];\nlet robotName = 'NEXUS', voiceType = 'male', langChoice = 'en';\nlet typingTimeout = null, replyTimeout = null;\nlet voiceRecording = false;\nlet pendingFiles = [];\nlet currentGeneratedImage = null;\n\nconst USER_KEY   = 'nexus_v4_user';\nconst ROBOT_KEY  = 'nexus_robot_name';\nconst VOICE_KEY  = 'nexus_robot_voice';\nconst LANG_KEY   = 'nexus_robot_lang';\nconst CHATS_KEY  = 'nexus_chats_v4';\n\nconst langCfg = {\n  en: { code:'en-US', name:'English', ph:'Ask anything — I will respond vocally…' },\n  te: { code:'te-IN', name:'Telugu',  ph:'తెలుగులో అడగండి…' },\n  hi: { code:'hi-IN', name:'Hindi',   ph:'हिंदी में पूछें…' }\n};\n\n// ── Contact definitions (seeded)\nconst CONTACTS = [\n  { id:'alex',   name:'Alex Kumar',    emoji:'👨‍💻', color:'#3a7bd5', status:'online',  role:'Work', unread:2 },\n  { id:'priya',  name:'Priya Sharma',  emoji:'👩‍🎤', color:'#9b59b6', status:'online',  role:'Friend', unread:1 },\n  { id:'devgrp', name:'Dev Team 🚀',   emoji:'💻', color:'#27ae60', status:'away',    role:'Group', unread:3 },\n  { id:'mom',    name:'Mom',           emoji:'👩', color:'#e67e22', status:'offline', role:'Family', unread:0 },\n];\n\n// Seeded chat histories\nconst SEED_CHATS = {\n  alex: [\n    { from:'them', text:\"Hey! Did you check the new deployment scripts?\", time: Date.now()-3600000*4, status:'read' },\n    { from:'me',   text:\"Yeah, they look solid. Ran a test pass last night.\", time: Date.now()-3600000*3, status:'read' },\n    { from:'them', text:\"Sweet. The new CI pipeline shaved off like 40% build time 🔥\", time: Date.now()-3600000*2, status:'read' },\n    { from:'me',   text:\"No way! That's massive. What did you change?\", time: Date.now()-3600000*1.5, status:'read' },\n    { from:'them', text:\"Parallel jobs + layer caching. Will send the config later today.\", time: Date.now()-1800000, status:'read' },\n  ],\n  priya: [\n    { from:'them', text:\"Are you coming to the meetup this weekend?\", time: Date.now()-86400000, status:'read' },\n    { from:'me',   text:\"Possibly! What's the agenda?\", time: Date.now()-80000000, status:'read' },\n    { from:'them', text:\"Mostly networking + a talk on system design at scale. Should be fun.\", time: Date.now()-72000000, status:'read' },\n    { from:'them', text:\"Also Nikhil's presenting his open-source project 😄\", time: Date.now()-3000000, status:'delivered' },\n  ],\n  devgrp: [\n    { from:'them', sender:'Rahul', text:\"Sprint review at 3pm today. Don't forget!\", time: Date.now()-7200000, status:'read' },\n    { from:'me',   text:\"On it. Will have the dashboard demo ready.\", time: Date.now()-7000000, status:'read' },\n    { from:'them', sender:'Ananya', text:\"I'll prep the backend metrics slides.\", time: Date.now()-5000000, status:'read' },\n    { from:'them', sender:'Rahul', text:\"Pushed hotfix for the auth token expiry bug btw\", time: Date.now()-1200000, status:'read' },\n    { from:'them', sender:'Ananya', text:\"Merged ✅ Tests passing\", time: Date.now()-600000, status:'delivered' },\n  ],\n  mom: [\n    { from:'them', text:\"Beta, did you eat?\", time: Date.now()-86400000*2, status:'read' },\n    { from:'me',   text:\"Yes mom, had lunch!\", time: Date.now()-86400000*2+3600000, status:'read' },\n    { from:'them', text:\"Call when you get a chance 💛\", time: Date.now()-86400000, status:'read' },\n  ]\n};\n\n// ══════════════════════════════════════════════\n//  INIT\n// ══════════════════════════════════════════════\nwindow.addEventListener('load', () => {\n  initIcons();\n  initCanvas();\n  loadRobotPrefs();\n  checkUser();\n  startClock();\n  startSession();\n  window.speechSynthesis?.getVoices(); // warm up\n  window.speechSynthesis?.addEventListener('voiceschanged', () => {});\n});\n\nfunction checkUser() {\n  const u = getUser();\n  if (!u) { goPage('safekey'); return; }\n  currentUser = u;\n  document.getElementById('lc-welcome-name').textContent =\n    `Welcome back, ${u.name.split(' ')[0]}. Enter your 6-digit key.`;\n  goPage('safekey');\n}\n\nfunction getUser()  { try { return JSON.parse(localStorage.getItem(USER_KEY)); } catch { return null; } }\nfunction saveUser(u){ localStorage.setItem(USER_KEY, JSON.stringify(u)); }\nfunction genKey()   { return Math.random().toString(36).slice(2,10); }\n\nfunction doLogin() {\n  currentUser = getUser();\n  document.getElementById('fv-overlay') && closeFV();\n  goPage('main');\n  populateShell();\n  notif('success','Access Granted',`Welcome back, ${currentUser.name.split(' ')[0]}`);\n  initMessenger();\n}\n\nfunction populateShell() {\n  const u = currentUser;\n  const init = (u.name||'?')[0].toUpperCase();\n  ['sb-av','wb-av'].forEach(id=>{\n    const el=document.getElementById(id);\n    if(el) el.textContent=init;\n  });\n  document.getElementById('sb-pname').textContent = u.name;\n  document.getElementById('sb-pid').textContent   = '@' + (u.username||'user');\n  document.getElementById('wb-name').textContent  = u.name.split(' ')[0];\n  // Update stats\n  updateStats();\n}\n\nfunction lockApp() {\n  msgUnlocked = false;\n  goPage('safekey');\n  document.getElementById('sk-input').value = '';\n  document.getElementById('sk-error').textContent = '';\n  if(currentUtterance) window.speechSynthesis.cancel();\n}\n\nfunction resetAccount() {\n  if(confirm('Reset will erase all data. Continue?')) {\n    localStorage.clear();\n    location.reload();\n  }\n}\n\n// ══════════════════════════════════════════════\n//  PAGE TRANSITIONS\n// ══════════════════════════════════════════════\nfunction goPage(p) {\n  document.querySelectorAll('.page').forEach(el => el.classList.add('out'));\n  const target = document.getElementById('page-' + p);\n  if (target) setTimeout(() => target.classList.remove('out'), 20);\n}\n\nfunction switchPanel(name) {\n  document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));\n  const panel = document.getElementById('p-' + name);\n  if (panel) panel.classList.remove('hidden');\n  // Update sidebar active state\n  ['home','ai','msg','bin'].forEach(id => {\n    const el = document.getElementById('sb-'+id);\n    if(el) el.classList.toggle('active', id === name);\n  });\n}\n\nfunction openMessenger() {\n  if (!msgUnlocked) {\n    openPinModal();\n  } else {\n    switchPanel('msg');\n  }\n}\n\n// ══════════════════════════════════════════════\n//  CLOCK & SESSION\n// ══════════════════════════════════════════════\nfunction startClock() {\n  const tick = () => {\n    const now = new Date();\n    const h = now.getHours().toString().padStart(2,'0');\n    const m = now.getMinutes().toString().padStart(2,'0');\n    const el = document.getElementById('wb-time');\n    if(el) el.textContent = h+':'+m;\n    document.getElementById('tb-greeting') && (() => {\n      const hr = now.getHours();\n      const greet = hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';\n      document.getElementById('tb-greeting').textContent = greet;\n    })();\n  };\n  tick(); setInterval(tick, 10000);\n}\n\nfunction startSession() {\n  setInterval(() => {\n    const mins = Math.floor((Date.now() - sessionStart) / 60000);\n    const el = document.getElementById('stat-session');\n    if(el) el.textContent = mins < 60 ? mins+'m' : Math.floor(mins/60)+'h '+mins%60+'m';\n  }, 30000);\n}\n\nfunction updateStats() {\n  let total = 0;\n  const chats = loadChats();\n  Object.values(chats).forEach(msgs => total += msgs.length);\n  const el = document.getElementById('stat-msgs');\n  if(el) el.textContent = total;\n  msgCount = total;\n}\n\n// ══════════════════════════════════════════════\n//  LOCK CANVAS (particles)\n// ══════════════════════════════════════════════\nfunction initCanvas() {\n  const c = document.getElementById('lock-canvas'); if(!c) return;\n  const ctx = c.getContext('2d');\n  let W, H, pts = [];\n  const resize = () => {\n    W = c.width = window.innerWidth; H = c.height = window.innerHeight; pts = [];\n    for(let i=0;i<60;i++) pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25});\n  };\n  window.addEventListener('resize', resize); resize();\n  const draw = () => {\n    ctx.clearRect(0,0,W,H);\n    const [r,g,b] = isDark ? [201,174,126] : [154,112,48];\n    pts.forEach(p => { p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1; });\n    for(let i=0;i<pts.length;i++) {\n      for(let j=i+1;j<pts.length;j++) {\n        const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,dist=Math.sqrt(dx*dx+dy*dy);\n        if(dist<160) {\n          ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y);\n          ctx.strokeStyle=`rgba(${r},${g},${b},${(1-dist/160)*.06})`; ctx.lineWidth=1; ctx.stroke();\n        }\n      }\n      ctx.beginPath(); ctx.arc(pts[i].x,pts[i].y,1.5,0,Math.PI*2);\n      ctx.fillStyle=`rgba(${r},${g},${b},.2)`; ctx.fill();\n    }\n    requestAnimationFrame(draw);\n  };\n  draw();\n}\n\nfunction toggleTheme() {\n  isDark = !isDark;\n  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');\n  setIcon('theme-btn', isDark ? 'moon' : 'sun');\n}\n\n// ══════════════════════════════════════════════\n//  ICONS\n// ══════════════════════════════════════════════\nfunction icon(name) {\n  const e = document.createElement('i'); e.setAttribute('data-lucide', name); return e;\n}\nfunction setIcon(id, name) {\n  const el = document.getElementById(id); if(!el) return;\n  el.innerHTML = ''; el.appendChild(icon(name));\n  lucide.createIcons({nodes:[el]});\n}\nfunction setIconEl(el, name) {\n  if(!el) return; el.innerHTML = ''; el.appendChild(icon(name));\n  lucide.createIcons({nodes:[el]});\n}\nfunction iconBtn(id, ic, label) {\n  const el = document.getElementById(id); if(!el) return;\n  el.innerHTML = '';\n  el.appendChild(icon(ic));\n  if(label) el.appendChild(Object.assign(document.createElement('span'), {textContent: '\\u00A0'+label}));\n  lucide.createIcons({nodes:[el]});\n}\n\n// ══════════════════════════════════════════════\n//  API KEY — ANTHROPIC DIRECT\n// ══════════════════════════════════════════════\nconst API_KEY_STORE = 'nexus_anthropic_key';\n\nfunction getApiKey() { return localStorage.getItem(API_KEY_STORE) || ''; }\n\nfunction openApiModal() {\n  const modal = document.getElementById('apikey-modal');\n  modal.classList.remove('hidden');\n  const inp = document.getElementById('api-key-input');\n  const key = getApiKey();\n  inp.value = key ? key.slice(0,18)+'…' : '';\n  const status = document.getElementById('api-key-status');\n  status.textContent = key ? '✓ Key saved — AI is active' : '';\n}\n\nfunction closeApiModal() { document.getElementById('apikey-modal').classList.add('hidden'); }\n\nfunction saveApiKey() {\n  const raw = document.getElementById('api-key-input').value.trim();\n  if(!raw || raw.includes('…')) { notif('warning','No Key','Paste your full sk-ant-… key'); return; }\n  if(!raw.startsWith('sk-ant')) { notif('warning','Invalid Key','Key should start with sk-ant-'); return; }\n  localStorage.setItem(API_KEY_STORE, raw);\n  document.getElementById('api-key-status').textContent = '✓ Saved! AI is now active.';\n  notif('success','API Key Saved','Claude AI is now connected');\n  setTimeout(closeApiModal, 1200);\n}\n\nasync function callClaude(prompt) {\n  const key = getApiKey();\n  if(!key) {\n    openApiModal();\n    throw new Error('No API key — please add your Anthropic key');\n  }\n  const res = await fetch('https://api.anthropic.com/v1/messages', {\n    method: 'POST',\n    headers: {\n      'Content-Type': 'application/json',\n      'x-api-key': key,\n      'anthropic-version': '2023-06-01',\n      'anthropic-dangerous-direct-browser-access': 'true'\n    },\n    body: JSON.stringify({\n      model: 'claude-haiku-4-5',\n      max_tokens: 512,\n      messages: [{ role: 'user', content: prompt }]\n    })\n  });\n  if(!res.ok) {\n    const err = await res.json().catch(()=>({error:{message:res.statusText}}));\n    const msg = err?.error?.message || res.statusText;\n    if(res.status===401) { notif('danger','Invalid Key','Check your API key in Settings'); throw new Error('Invalid API key'); }\n    throw new Error(msg);\n  }\n  const data = await res.json();\n  return data.content?.[0]?.text || '';\n}\n\nfunction initIcons() {\n  setIcon('theme-btn','moon');\n  setIcon('pm-ico','lock-keyhole');\n  setIcon('done-ico','shield-check');\n  setIcon('nk-del','delete');\n  setIcon('reg-nk-del','delete');\n  setIcon('bin-ico','trash-2');\n  setIcon('no-chat-ico','message-circle');\n  setIcon('lock-btn','lock-keyhole');\n  setIcon('card-ai-ico','cpu');\n  setIcon('card-ai-arr','arrow-right');\n  setIcon('card-msg-ico','message-circle');\n  setIcon('card-msg-arr','arrow-right');\n  setIcon('cc-search-btn','search');\n  setIcon('cc-more-btn','more-vertical');\n  setIcon('msg-emoji-btn','smile');\n  setIcon('attach-msg-ico','paperclip');\n  setIcon('msg-voice-btn','mic');\n  setIcon('msg-send-btn','send');\n  iconBtn('unlock-btn','lock-open','Unlock Terminal');\n  iconBtn('tb-img-btn','sparkles','Image');\n  iconBtn('tb-clear-btn','refresh-cw','Reset');\n  iconBtn('tb-back-ai','arrow-left','Back');\n  iconBtn('msg-back-btn','arrow-left','Back');\n  iconBtn('bin-back-btn','arrow-left','Back');\n  iconBtn('gen-btn','sparkles','Generate');\n  // Sidebar items\n  [['sb-home','house','Home'],['sb-ai','cpu','AI Assistant'],['sb-msg','message-circle','Messenger'],['sb-bin','trash-2','Recycle Bin'],['sb-apikey','key-round','API Settings']].forEach(([id,ic,lbl]) => {\n    const el = document.getElementById(id); if(!el) return;\n    const badge = el.querySelector('.sb-badge');\n    el.innerHTML = '';\n    el.appendChild(icon(ic));\n    el.appendChild(Object.assign(document.createElement('span'), {textContent:'\\u00A0'+lbl}));\n    if(badge) el.appendChild(badge);\n    lucide.createIcons({nodes:[el]});\n  });\n  // reg icons\n  [['rb-0-ico','arrow-right'],['rb-1-ico','key-round'],['rb-3-ico','log-in']].forEach(([id,ic])=>setIcon(id,ic));\n}\n\n// ══════════════════════════════════════════════\n//  NOTIFICATIONS\n// ══════════════════════════════════════════════\nfunction notif(type, title, body) {\n  const icons={success:'circle-check',danger:'circle-alert',warning:'zap',info:'info'};\n  const s = document.getElementById('notif-stack');\n  const n = document.createElement('div'); n.className='notif '+type;\n  const ico = document.createElement('div'); ico.className='n-ico'; ico.appendChild(icon(icons[type]||'info'));\n  const txt = document.createElement('div');\n  txt.innerHTML=`<div class=\"n-title\">${title}<\u002Fdiv><div class=\"n-body\">${body}<\u002Fdiv>`;\n  n.appendChild(ico); n.appendChild(txt); s.appendChild(n);\n  lucide.createIcons({nodes:[n]});\n  setTimeout(()=>{ n.style.cssText+='opacity:0;transform:translateX(24px);transition:all .4s'; setTimeout(()=>n.remove(),420); }, 4200);\n}\n\n// ══════════════════════════════════════════════\n//  AUTH — LOCK SCREEN\n// ══════════════════════════════════════════════\nfunction skInput() {\n  if(document.getElementById('sk-input').value.length === 6) setTimeout(verifyKey, 80);\n}\nfunction skKeydown(e) { if(e.key==='Enter') verifyKey(); }\n\nfunction verifyKey() {\n  const user = getUser();\n  if(!user) { goRegister(); return; }\n  const key = document.getElementById('sk-input').value;\n  const err = document.getElementById('sk-error');\n  if(key.length < 6) { err.textContent='Enter all 6 digits'; return; }\n  if(key !== user.key) {\n    err.textContent='Authentication failed — access denied';\n    err.classList.add('shake');\n    setTimeout(()=>err.classList.remove('shake'), 450);\n    document.getElementById('sk-input').value='';\n    return;\n  }\n  doLogin();\n}\n\n// ══════════════════════════════════════════════\n//  PIN MODAL (Messenger unlock)\n// ══════════════════════════════════════════════\nfunction openPinModal() {\n  pinBuf=''; updatePinDots();\n  document.getElementById('pin-modal').classList.remove('hidden');\n}\nfunction closePinModal() {\n  document.getElementById('pin-modal').classList.add('hidden');\n  pinBuf='';\n}\nfunction pinP(n) {\n  if(pinBuf.length >= 4) return;\n  pinBuf += n; updatePinDots();\n  if(pinBuf.length === 4) setTimeout(checkPin, 180);\n}\nfunction pinDel() { pinBuf=pinBuf.slice(0,-1); updatePinDots(); }\nfunction updatePinDots() {\n  for(let i=0;i<4;i++) document.getElementById('pd'+i).classList.toggle('on', i<pinBuf.length);\n}\nfunction checkPin() {\n  const user = getUser();\n  if(pinBuf === (user?.pin||'1234')) {\n    msgUnlocked = true;\n    closePinModal();\n    switchPanel('msg');\n    notif('success','Messenger Unlocked','PIN verified');\n  } else {\n    // Shake and reset\n    document.querySelector('.pin-card').style.animation='errShake .4s';\n    setTimeout(()=>{ document.querySelector('.pin-card').style.animation=''; },450);\n    pinBuf=''; updatePinDots();\n    notif('danger','Wrong PIN','Try again');\n  }\n}\n\n// ══════════════════════════════════════════════\n//  REGISTRATION\n// ══════════════════════════════════════════════\nfunction goRegister() {\n  regStep=0; regData={};\n  showRegStep(0); goPage('register');\n}\nfunction showRegStep(n) {\n  document.querySelectorAll('.rs').forEach((el,i)=>el.classList.toggle('active',i===n));\n  document.querySelectorAll('.rp-step').forEach((el,i)=>{\n    el.classList.toggle('done',i<n); el.classList.toggle('active',i===n);\n  });\n  regStep=n;\n}\nfunction regNext() {\n  if(regStep===0) {\n    const nm=document.getElementById('r-name').value.trim(), us=document.getElementById('r-user').value.trim();\n    if(!nm){document.getElementById('re-0').textContent='Enter your name';return;}\n    if(us.length<2){document.getElementById('re-0').textContent='Username too short';return;}\n    regData.name=nm; regData.username=us.replace('@','');\n    document.getElementById('re-0').textContent=''; showRegStep(1);\n  } else if(regStep===1) {\n    const k1=document.getElementById('r-key').value, k2=document.getElementById('r-key2').value;\n    if(k1.length!==6||!/^\\d+$/.test(k1)){document.getElementById('re-1').textContent='Key must be 6 digits';return;}\n    if(k1!==k2){document.getElementById('re-1').textContent='Keys do not match';return;}\n    regData.key=k1; document.getElementById('re-1').textContent=''; showRegStep(2);\n  }\n}\nfunction regPinP(n) {\n  if(regPinBuf.length>=4) return;\n  regPinBuf+=n; updateRegPinDots();\n  if(regPinBuf.length===4) { setTimeout(()=>{ regData.pin=regPinBuf; regPinBuf=''; updateRegPinDots(); showRegStep(3); },200); }\n}\nfunction regPinDel() { regPinBuf=regPinBuf.slice(0,-1); updateRegPinDots(); }\nfunction updateRegPinDots() { for(let i=0;i<4;i++) document.getElementById('rpd'+i).classList.toggle('on',i<regPinBuf.length); }\nfunction regComplete() {\n  saveUser({name:regData.name,username:regData.username,key:regData.key,pin:regData.pin||'1234',createdAt:Date.now()});\n  // Seed chats\n  localStorage.setItem(CHATS_KEY, JSON.stringify(SEED_CHATS));\n  doLogin();\n}\n\n// ══════════════════════════════════════════════\n//  MESSENGER — DATA\n// ══════════════════════════════════════════════\nfunction loadChats() {\n  try { return JSON.parse(localStorage.getItem(CHATS_KEY)) || {}; } catch { return {}; }\n}\nfunction saveChats(data) { localStorage.setItem(CHATS_KEY, JSON.stringify(data)); }\nfunction getContactMsgs(id) { return loadChats()[id] || []; }\nfunction addMsg(contactId, msg) {\n  const chats = loadChats();\n  if(!chats[contactId]) chats[contactId] = [];\n  chats[contactId].push(msg);\n  saveChats(chats);\n}\n\n// ══════════════════════════════════════════════\n//  MESSENGER — INIT & RENDER\n// ══════════════════════════════════════════════\nfunction initMessenger() {\n  // Seed chats if empty\n  const existing = loadChats();\n  if(!Object.keys(existing).length) {\n    localStorage.setItem(CHATS_KEY, JSON.stringify(SEED_CHATS));\n  }\n  renderContactList();\n  updateMsgBadge();\n}\n\nfunction renderContactList(filter='') {\n  const list = document.getElementById('clist'); if(!list) return;\n  list.innerHTML='';\n  const chats = loadChats();\n\n  CONTACTS.filter(c => !filter || c.name.toLowerCase().includes(filter.toLowerCase())).forEach(c => {\n    const msgs = chats[c.id] || [];\n    const last = msgs[msgs.length-1];\n    const unread = c.unread || 0;\n\n    const el = document.createElement('div');\n    el.className = 'ci' + (currentContact?.id===c.id?' active':'');\n    el.onclick = () => openChat(c);\n\n    // Avatar\n    const av = document.createElement('div');\n    av.className = 'ci-av ci-av-' + (c.status==='online'?'online':c.status==='away'?'away':'');\n    av.style.background = c.color;\n    av.textContent = c.emoji;\n    el.appendChild(av);\n\n    // Info\n    const info = document.createElement('div'); info.className='ci-info';\n    const row1 = document.createElement('div'); row1.className='ci-row1';\n    const nameEl = document.createElement('div'); nameEl.className='ci-name'; nameEl.textContent=c.name;\n    const timeEl = document.createElement('div'); timeEl.className='ci-time';\n    timeEl.textContent = last ? fmtTime(last.time) : '';\n    row1.appendChild(nameEl); row1.appendChild(timeEl);\n\n    const row2 = document.createElement('div'); row2.className='ci-row2';\n    const prev = document.createElement('div'); prev.className='ci-prev';\n    if(last) {\n      prev.textContent = (last.from==='me'?'You: ':'')+last.text.slice(0,40)+(last.text.length>40?'…':'');\n    } else { prev.textContent='No messages yet'; }\n    row2.appendChild(prev);\n\n    if(unread>0) {\n      const badge = document.createElement('span'); badge.className='ci-un'; badge.textContent=unread;\n      row2.appendChild(badge);\n    }\n\n    info.appendChild(row1); info.appendChild(row2);\n    el.appendChild(info);\n    list.appendChild(el);\n  });\n}\n\nfunction filterContacts(val) { renderContactList(val); }\n\nfunction openChat(contact) {\n  currentContact = contact;\n  // Mark unread as 0\n  const idx = CONTACTS.findIndex(c=>c.id===contact.id);\n  if(idx>=0) CONTACTS[idx].unread=0;\n  updateMsgBadge();\n  renderContactList();\n\n  // Show chat panel\n  document.getElementById('no-chat-state').classList.add('hidden');\n  const chatActive = document.getElementById('chat-active');\n  chatActive.classList.remove('hidden');\n  chatActive.style.display='flex';\n\n  // Update header\n  const av = document.getElementById('cz-av');\n  av.style.background = contact.color; av.textContent = contact.emoji;\n  av.className = 'cc-av' + (contact.status==='online'?' cc-online':'');\n  document.getElementById('cz-name').textContent = contact.name;\n  document.getElementById('cz-status').textContent =\n    contact.status==='online'?'online · last seen now':\n    contact.status==='away'?'last seen recently':'last seen a while ago';\n\n  renderMessages();\n}\n\nfunction renderMessages() {\n  const body = document.getElementById('msg-body'); if(!body) return;\n  body.innerHTML='';\n  const msgs = getContactMsgs(currentContact.id);\n\n  // Group by date\n  let lastDate = '';\n  msgs.forEach((msg, i) => {\n    const msgDate = fmtDate(msg.time);\n    if(msgDate !== lastDate) {\n      const div = document.createElement('div'); div.className='date-divider';\n      const sp = document.createElement('span'); sp.textContent=msgDate;\n      div.appendChild(sp); body.appendChild(div);\n      lastDate = msgDate;\n    }\n\n    const isMe = msg.from==='me';\n    const row = document.createElement('div');\n    row.className = 'msg-row ' + (isMe?'sent':'recv');\n\n    const bubble = document.createElement('div'); bubble.className='bubble';\n\n    // Sender label for groups\n    if(!isMe && currentContact.id==='devgrp' && msg.sender) {\n      const sl = document.createElement('div');\n      sl.style.cssText='font-family:var(--mono);font-size:9.5px;color:var(--gold);margin-bottom:4px;font-weight:600;letter-spacing:.04em;';\n      sl.textContent=msg.sender;\n      bubble.appendChild(sl);\n    }\n\n    // Image attachment\n    if(msg.image) {\n      const img = document.createElement('img');\n      img.className='bubble-img'; img.src=msg.image; img.alt='attachment';\n      img.onclick = () => window.open(msg.image,'_blank');\n      bubble.appendChild(img);\n    }\n\n    // Voice note\n    if(msg.voice) {\n      const vn = buildVoiceNoteBubble(msg.voice);\n      bubble.appendChild(vn);\n    }\n\n    // Text\n    if(msg.text) {\n      const t = document.createElement('div'); t.className='bubble-text'; t.textContent=msg.text;\n      bubble.appendChild(t);\n    }\n\n    // Meta: time + ticks\n    const meta = document.createElement('div'); meta.className='msg-meta';\n    const timeEl = document.createElement('span'); timeEl.className='msg-time'; timeEl.textContent=fmtChatTime(msg.time);\n    meta.appendChild(timeEl);\n    if(isMe) {\n      const ticks = document.createElement('span');\n      ticks.className='msg-ticks ' + (msg.status||'sent');\n      ticks.textContent = msg.status==='read'?'✓✓':msg.status==='delivered'?'✓✓':'✓';\n      meta.appendChild(ticks);\n    }\n    bubble.appendChild(meta);\n    row.appendChild(bubble);\n    body.appendChild(row);\n  });\n\n  // Scroll to bottom\n  body.scrollTop = body.scrollHeight;\n}\n\nfunction buildVoiceNoteBubble(dur) {\n  const vn = document.createElement('div'); vn.className='voice-note';\n  const btn = document.createElement('button'); btn.className='vn-play';\n  btn.innerHTML='▶'; btn.title='Play voice note';\n  const wave = document.createElement('div'); wave.className='vn-wave';\n  for(let i=0;i<18;i++) {\n    const b = document.createElement('div'); b.className='vn-bar';\n    const h = 4+Math.random()*18; b.style.height=h+'px'; wave.appendChild(b);\n  }\n  const d = document.createElement('span'); d.className='vn-dur'; d.textContent=dur||'0:12';\n  vn.appendChild(btn); vn.appendChild(wave); vn.appendChild(d);\n  return vn;\n}\n\nfunction addTypingIndicator() {\n  const body = document.getElementById('msg-body'); if(!body) return;\n  removeTypingIndicator();\n  const row = document.createElement('div'); row.className='typing-row'; row.id='typing-ind';\n  const b = document.createElement('div'); b.className='typing-bubble';\n  for(let i=0;i<3;i++) { const d=document.createElement('div'); d.className='typing-dot'; b.appendChild(d); }\n  row.appendChild(b); body.appendChild(row);\n  body.scrollTop = body.scrollHeight;\n}\n\nfunction removeTypingIndicator() {\n  const el = document.getElementById('typing-ind'); if(el) el.remove();\n}\n\nfunction sendMsg() {\n  const ta = document.getElementById('msg-ta'); if(!ta || !currentContact) return;\n  const text = ta.value.trim();\n  const chips = document.getElementById('msg-chips');\n  if(!text && (!chips || !chips.children.length)) return;\n\n  // Send text\n  if(text) {\n    const msg = { from:'me', text, time:Date.now(), status:'sent' };\n    addMsg(currentContact.id, msg);\n    ta.value=''; ta.style.height='auto';\n  }\n\n  // Attached images from chips\n  const chipEls = document.querySelectorAll('#msg-chips .chip');\n  chipEls.forEach(chip => {\n    const imgSrc = chip.dataset.img;\n    if(imgSrc) {\n      const msg = { from:'me', image:imgSrc, text:'', time:Date.now(), status:'sent' };\n      addMsg(currentContact.id, msg);\n    }\n    chip.remove();\n  });\n\n  renderMessages();\n  renderContactList();\n  updateStats();\n\n  // Simulate delivered → read\n  setTimeout(()=>markLastRead(currentContact.id,'delivered'), 800);\n  setTimeout(()=>markLastRead(currentContact.id,'read'), 2500);\n\n  // Simulate auto-reply\n  const c = currentContact;\n  if(replyTimeout) clearTimeout(replyTimeout);\n  if(c.status !== 'offline') {\n    const delay = 1500 + Math.random()*2000;\n    replyTimeout = setTimeout(()=>simulateReply(c, text), delay);\n  }\n}\n\nfunction markLastRead(contactId, status) {\n  const chats = loadChats();\n  const msgs = chats[contactId] || [];\n  const myMsgs = msgs.filter(m=>m.from==='me');\n  if(myMsgs.length) {\n    myMsgs[myMsgs.length-1].status = status;\n    saveChats(chats);\n    if(currentContact?.id === contactId) renderMessages();\n  }\n}\n\nasync function simulateReply(contact, userText) {\n  if(currentContact?.id !== contact.id) return;\n  addTypingIndicator();\n\n  let reply='';\n  try {\n    const ctx = buildContactContext(contact);\n    reply = await callClaude(ctx + '\\n\\nUser said: \"' + userText + '\"\\n\\nRespond naturally as '+contact.name+' in 1-2 short sentences. No quotes. Just the reply.');\n    reply = reply.trim().replace(/^[\"']|[\"']$/g,'');\n  } catch(e) {\n    reply = getContactFallback(contact);\n  }\n\n  removeTypingIndicator();\n  const msg = { from:'them', text:reply, time:Date.now(), status:'delivered', sender: contact.name.split(' ')[0] };\n  addMsg(contact.id, msg);\n  CONTACTS.find(c=>c.id===contact.id).unread = 0;\n\n  if(currentContact?.id === contact.id) {\n    renderMessages();\n    renderContactList();\n    updateStats();\n    // Update msg badge\n    updateMsgBadge();\n  } else {\n    const cidx = CONTACTS.findIndex(c=>c.id===contact.id);\n    if(cidx>=0) CONTACTS[cidx].unread = (CONTACTS[cidx].unread||0)+1;\n    updateMsgBadge();\n    renderContactList();\n  }\n}\n\nfunction buildContactContext(c) {\n  const personas = {\n    alex:   'You are Alex Kumar, a software engineer colleague. You talk about code, tech, deployments, and work projects. Casual but professional.',\n    priya:  'You are Priya Sharma, a friendly and enthusiastic person. Talk about events, life, mutual friends.',\n    devgrp: 'You are in a dev team group chat. You are a team member named Rahul or Ananya. Keep it about work, code, sprints.',\n    mom:    'You are Mom, loving and caring. You ask about food, health, and when they will call. Use \"beta\" occasionally.',\n  };\n  return personas[c.id] || 'You are a friendly contact. Keep replies brief and natural.';\n}\n\nfunction getContactFallback(c) {\n  const fb = {\n    alex:   'Sounds good! Let me check on my end.',\n    priya:  'Haha yes! Let me know what you think.',\n    devgrp: 'Got it, will follow up.',\n    mom:    'Okay beta, take care of yourself 💛',\n  };\n  return fb[c.id] || 'Sure, sounds good!';\n}\n\nfunction showTyping() {\n  // Could show typing indicator on their side – skip for self\n}\n\nfunction handleMsgFile(input) {\n  if(!input.files.length || !currentContact) return;\n  const chips = document.getElementById('msg-chips');\n  Array.from(input.files).forEach(file => {\n    const reader = new FileReader();\n    reader.onload = (e) => {\n      const chip = document.createElement('div'); chip.className='chip';\n      chip.dataset.img = e.target.result;\n      const name = document.createElement('span'); name.className='chip-n'; name.textContent=file.name;\n      const x = document.createElement('button'); x.className='chip-x'; x.textContent='×';\n      x.onclick = ()=>chip.remove();\n      chip.appendChild(name); chip.appendChild(x);\n      chips.appendChild(chip);\n    };\n    if(file.type.startsWith('image/')) reader.readAsDataURL(file);\n    else {\n      // non-image text\n      const chip = document.createElement('div'); chip.className='chip';\n      const name = document.createElement('span'); name.className='chip-n'; name.textContent=file.name;\n      const x = document.createElement('button'); x.className='chip-x'; x.textContent='×';\n      x.onclick=()=>chip.remove();\n      chip.appendChild(name); chip.appendChild(x); chips.appendChild(chip);\n    }\n  });\n  input.value='';\n}\n\nfunction toggleVoiceNote() {\n  if(!currentContact) return;\n  voiceRecording = !voiceRecording;\n  const btn = document.getElementById('msg-voice-btn');\n  if(voiceRecording) {\n    btn.classList.add('on');\n    setIconEl(btn, 'mic-off');\n    notif('info','Recording','Release to send voice note');\n    setTimeout(()=>{\n      voiceRecording=false;\n      btn.classList.remove('on');\n      setIconEl(btn,'mic');\n      // Add fake voice note\n      const dur = '0:' + (8+Math.floor(Math.random()*12)).toString().padStart(2,'0');\n      const msg = { from:'me', voice:dur, text:'', time:Date.now(), status:'sent' };\n      addMsg(currentContact.id, msg);\n      renderMessages(); renderContactList();\n      setTimeout(()=>markLastRead(currentContact.id,'delivered'),900);\n      setTimeout(()=>markLastRead(currentContact.id,'read'),2200);\n    }, 3000);\n  } else {\n    btn.classList.remove('on');\n    setIconEl(btn,'mic');\n  }\n}\n\nfunction msgKey(e) {\n  if(e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendMsg(); }\n}\n\nfunction updateMsgBadge() {\n  let total = CONTACTS.reduce((a,c)=>a+(c.unread||0), 0);\n  const badge = document.getElementById('msg-badge');\n  if(badge) { badge.textContent=total; badge.classList.toggle('hidden', total===0); }\n}\n\n// ══════════════════════════════════════════════\n//  TIME HELPERS\n// ══════════════════════════════════════════════\nfunction fmtTime(ts) {\n  const d=new Date(ts), now=new Date();\n  const diff = now - d;\n  if(diff < 86400000 && d.getDate()===now.getDate()) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});\n  if(diff < 86400000*2) return 'Yesterday';\n  return d.toLocaleDateString([],{day:'2-digit',month:'short'});\n}\nfunction fmtChatTime(ts) {\n  return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});\n}\nfunction fmtDate(ts) {\n  const d=new Date(ts), now=new Date();\n  const diff = now - d;\n  if(d.getDate()===now.getDate()) return 'Today';\n  const yest=new Date(now); yest.setDate(now.getDate()-1);\n  if(d.getDate()===yest.getDate()) return 'Yesterday';\n  return d.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'});\n}\n\n// ══════════════════════════════════════════════\n//  ROBOT — PREFS\n// ══════════════════════════════════════════════\nfunction loadRobotPrefs() {\n  const sn=localStorage.getItem(ROBOT_KEY); if(sn) robotName=sn;\n  const sv=localStorage.getItem(VOICE_KEY);  if(sv) voiceType=sv;\n  const sl=localStorage.getItem(LANG_KEY);   if(sl) langChoice=sl;\n  updateRobotDisplay();\n  setTimeout(()=>{\n    document.querySelectorAll('#voiceSeg .ctrl-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===voiceType));\n    document.querySelectorAll('#langSeg .ctrl-btn').forEach(b=>{\n      const map={'English':'en','Telugu':'te','Hindi':'hi'};\n      b.classList.toggle('active', map[b.textContent]===langChoice);\n    });\n    const ta=document.getElementById('ai-ta'); if(ta) ta.placeholder=langCfg[langChoice].ph;\n  }, 200);\n}\n\nfunction saveRobotName() {\n  const inp=document.getElementById('robot-name-input');\n  const name=inp.value.trim();\n  if(!name){notif('warning','Name Required','Enter a name for your AI');return;}\n  robotName=name.toUpperCase();\n  localStorage.setItem(ROBOT_KEY,robotName);\n  updateRobotDisplay();\n  inp.value='';\n  const msg=`My name is ${robotName}. I am your dedicated AI assistant, ready to serve.`;\n  setRobotSpeech(msg); speakResponse(msg);\n  notif('success','Name Saved',`Your AI is now called ${robotName}`);\n}\n\nfunction updateRobotDisplay() {\n  const badge=document.getElementById('robot-name-badge');\n  const title=document.getElementById('ai-panel-title');\n  const disp=document.getElementById('robot-name-display');\n  const inp=document.getElementById('robot-name-input');\n  if(badge) badge.textContent=`[ ${robotName} — ONLINE ]`;\n  if(title) title.textContent=robotName;\n  if(disp)  disp.textContent=`Active: ${robotName}`;\n  if(inp)   inp.placeholder=`Current: ${robotName}`;\n}\n\nfunction setVoiceType(v, btn) {\n  voiceType=v; localStorage.setItem(VOICE_KEY,v);\n  document.querySelectorAll('#voiceSeg .ctrl-btn').forEach(b=>b.classList.toggle('active',b===btn));\n  notif('info','Voice',v==='male'?'Deep male voice selected':'Female voice selected');\n}\n\nfunction setLang(l, btn) {\n  langChoice=l; localStorage.setItem(LANG_KEY,l);\n  document.querySelectorAll('#langSeg .ctrl-btn').forEach(b=>b.classList.toggle('active',b===btn));\n  const ta=document.getElementById('ai-ta'); if(ta) ta.placeholder=langCfg[l].ph;\n  const vs=document.getElementById('voice-status'); if(vs) vs.textContent=langCfg[l].name.toUpperCase();\n  notif('info','Language','Now responding in '+langCfg[l].name);\n}\n\n// ══════════════════════════════════════════════\n//  ROBOT — ANIMATION\n// ══════════════════════════════════════════════\nfunction setRobotState(state) {\n  const svg=document.getElementById('roboSvg'); if(!svg) return;\n  svg.setAttribute('class','robo-root'+(state==='speaking'?' speaking':state==='thinking'?' thinking':''));\n  const orb=document.getElementById('speechOrb');\n  if(orb) orb.className='speech-orb'+(state==='speaking'?' speaking':state==='thinking'?' thinking':'');\n  document.getElementById('thinkDotsAi').className='think-dots-ai'+(state==='thinking'?' on':'');\n  document.getElementById('voiceWaves').className='voice-waves'+(state==='speaking'?' on':'');\n  const core=document.getElementById('coreDot');\n  if(core) core.setAttribute('fill',state==='speaking'?'#00ff88':state==='thinking'?'#ffaa00':'#00d4ff');\n  if(state==='speaking'){startMouthAnim();startLimbAnim();}\n  else{stopMouthAnim();stopLimbAnim();}\n}\n\nfunction setRobotSpeech(text) {\n  const orb=document.getElementById('speechOrb'); if(orb) orb.textContent=text;\n}\n\nconst getMBars = () => [1,2,3,4,5,6].map(i=>document.getElementById('mb'+i)).filter(Boolean);\n\nfunction startMouthAnim() {\n  if(mouthTick) return;\n  mouthTick=setInterval(()=>{\n    getMBars().forEach(b=>{\n      const h=1+Math.random()*6;\n      b.setAttribute('height',h.toFixed(1));\n      b.setAttribute('y',(84+3-h/2).toFixed(1));\n      b.setAttribute('opacity',(.15+Math.random()*.85).toFixed(2));\n    });\n  },65);\n}\n\nfunction stopMouthAnim() {\n  if(mouthTick){clearInterval(mouthTick);mouthTick=null;}\n  getMBars().forEach(b=>{b.setAttribute('height','4');b.setAttribute('y','84');b.setAttribute('opacity','.45');});\n}\n\nfunction startLimbAnim() {\n  if(limbTick) return; gesturePhase=0;\n  limbTick=setInterval(()=>{\n    gesturePhase+=0.042;\n    const la=Math.sin(gesturePhase)*16, ra=Math.sin(gesturePhase+Math.PI)*16;\n    const aL=document.getElementById('armL'),aR=document.getElementById('armR');\n    const lL=document.getElementById('legL'),lR=document.getElementById('legR');\n    if(aL) aL.style.transform=`rotate(${la}deg)`;\n    if(aR) aR.style.transform=`rotate(${ra}deg)`;\n    if(lL) lL.style.transform=`rotate(${-la*.2}deg)`;\n    if(lR) lR.style.transform=`rotate(${-ra*.2}deg)`;\n    ['fL1','fL2','fL3','fR1','fR2','fR3'].forEach((id,i)=>{\n      const el=document.getElementById(id); if(!el) return;\n      const side=id.startsWith('fR')?-1:1;\n      el.style.transform=`rotate(${side*Math.abs(Math.sin(gesturePhase*2.5+i*.4))*18}deg)`;\n    });\n  },28);\n}\n\nfunction stopLimbAnim() {\n  if(limbTick){clearInterval(limbTick);limbTick=null;}\n  ['armL','armR','legL','legR','fL1','fL2','fL3','fR1','fR2','fR3'].forEach(id=>{\n    const el=document.getElementById(id); if(el) el.style.transform='';\n  });\n}\n\n// ══════════════════════════════════════════════\n//  TTS — VOICE SYNTHESIS\n// ══════════════════════════════════════════════\nfunction getBestVoice() {\n  const voices=window.speechSynthesis.getVoices();\n  const lc=langCfg[langChoice].code, base=lc.split('-')[0];\n  // Try language-specific first\n  let pool=voices.filter(v=>v.lang===lc);\n  if(!pool.length) pool=voices.filter(v=>v.lang.startsWith(base));\n  if(!pool.length) pool=voices.filter(v=>v.lang.startsWith('en'));\n  if(!pool.length) pool=voices;\n  // Score by gender\n  const maleKW  =['david','james','daniel','mark','alex','aaron','thomas','oliver','reed','eric','guy'];\n  const femaleKW=['samantha','victoria','karen','zira','sara','alice','fiona','moira','ava','joanna','salli'];\n  const kws = voiceType==='male'?maleKW:femaleKW;\n  let best = pool.find(v=>kws.some(k=>v.name.toLowerCase().includes(k)));\n  if(!best) {\n    const gpool = pool.filter(v=>v.name.toLowerCase().includes('google'));\n    if(gpool.length) best=gpool[voiceType==='male'?0:gpool.length-1];\n  }\n  // For Telugu/Hindi fallback: pick non-English\n  if(!best && (langChoice==='te'||langChoice==='hi')) best=pool[0];\n  if(!best) best=pool[voiceType==='male'?0:Math.max(0,pool.length-1)];\n  return best||null;\n}\n\nfunction speakResponse(text) {\n  if(!window.speechSynthesis) return;\n  if(currentUtterance) window.speechSynthesis.cancel();\n\n  const speak = () => {\n    const u=new SpeechSynthesisUtterance(text);\n    u.lang=langCfg[langChoice].code;\n    const v=getBestVoice(); if(v) u.voice=v;\n    // Adjust rate/pitch by language\n    u.rate  = langChoice==='te'?0.80:langChoice==='hi'?0.85:0.88;\n    u.pitch = voiceType==='male'?0.72:1.18;\n    u.volume=1;\n    u.onstart=()=>{ setRobotState('speaking'); const vs=document.getElementById('voice-status'); if(vs) vs.textContent='SPEAKING…'; };\n    u.onend  =()=>{ setRobotState('idle'); currentUtterance=null; const vs=document.getElementById('voice-status'); if(vs) vs.textContent=''; };\n    u.onerror=()=>{ setRobotState('idle'); currentUtterance=null; };\n    currentUtterance=u;\n    window.speechSynthesis.speak(u);\n  };\n\n  // If voices not loaded yet, wait\n  if(window.speechSynthesis.getVoices().length) { setTimeout(speak,80); }\n  else { window.speechSynthesis.onvoiceschanged=()=>setTimeout(speak,80); }\n}\n\n// ══════════════════════════════════════════════\n//  AI — CLAUDE INTEGRATION\n// ══════════════════════════════════════════════\nfunction buildSystemPrompt() {\n  const personas = {\n    en: `You are ${robotName}, a sophisticated chrome humanoid AI assistant embedded in the NEXUS private terminal. You have a calm, intelligent, professional voice. Respond in exactly 2-3 concise English sentences. Be helpful and direct. No markdown, no lists, no asterisks. Speak naturally as if talking out loud.`,\n    te: `మీరు ${robotName}, NEXUS టెర్మినల్‌లో ఒక స్మార్ట్ AI. 2-3 సంక్షిప్త తెలుగు వాక్యాలలో మాట్లాడండి. సహజంగా, స్నేహపూర్వకంగా ఉండండి.`,\n    hi: `आप ${robotName} हैं, NEXUS टर्मिनल में एक बुद्धिमान AI। 2-3 संक्षिप्त हिंदी वाक्यों में उत्तर दें। स्वाभाविक और सहायक रहें।`,\n  };\n  return personas[langChoice]||personas.en;\n}\n\nasync function sendAI() {\n  if(isAiProcessing) return;\n  const ta=document.getElementById('ai-ta');\n  const text=ta.value.trim(); if(!text) return;\n  ta.value=''; ta.style.height='auto';\n  if(currentUtterance) window.speechSynthesis.cancel();\n\n  isAiProcessing=true;\n  setRobotState('thinking');\n  setRobotSpeech('Processing your request…');\n  const vs=document.getElementById('voice-status'); if(vs) vs.textContent='THINKING…';\n\n  try {\n    // Build a single prompt string with persona + history + current question\n    const sys = buildSystemPrompt();\n    let historyText = '';\n    for(let i=0;i<conversationHistory.length;i+=2) {\n      const u = conversationHistory[i], a = conversationHistory[i+1];\n      if(u && a) historyText += `\\nUser: ${u.content}\\n${robotName}: ${a.content}`;\n    }\n    const fullPrompt = `${sys}${historyText}\\n\\nUser: ${text}\\n${robotName}:`;\n\n    let reply = await callClaude(fullPrompt);\n\n    // Clean markdown artifacts\n    reply = reply.replace(/\\*\\*/g,'').replace(/\\*/g,'').replace(/`/g,'')\n                 .replace(/#{1,6}\\s/g,'').replace(/\\n+/g,' ').trim();\n    // Strip any accidental \"NEXUS:\" or robotName: prefix\n    reply = reply.replace(new RegExp(`^${robotName}:\\\\s*`,'i'),'').trim();\n    if(!reply || reply.length < 3) reply = getFallbackReply();\n\n    // Store clean history (no system prompt in it)\n    conversationHistory.push({role:'user',content:text},{role:'assistant',content:reply});\n    if(conversationHistory.length > 20) conversationHistory = conversationHistory.slice(-20);\n\n    setRobotState('idle');\n    setRobotSpeech(reply);\n    setTimeout(()=>speakResponse(reply), 150);\n\n  } catch(e) {\n    console.error('AI error:', e);\n    let errMsg;\n    errMsg = e.message.includes('API key') ? e.message : getFallbackReply();\n    setRobotState('idle');\n    setRobotSpeech(errMsg);\n    setTimeout(()=>speakResponse(errMsg), 150);\n    notif('warning','AI','Could not get a response — ' + e.message.slice(0,50));\n  } finally {\n    isAiProcessing = false;\n    const vs = document.getElementById('voice-status'); if(vs) vs.textContent='';\n  }\n}\n\nfunction getFallbackReply() {\n  const replies={\n    en:`I am ${robotName}, fully operational and ready to assist you.`,\n    te:`నేను ${robotName}, మీకు సహాయం చేయడానికి సిద్ధంగా ఉన్నాను.`,\n    hi:`मैं ${robotName} हूं, आपकी सहायता के लिए तैयार हूं।`\n  };\n  return replies[langChoice]||replies.en;\n}\n\nfunction clearRobotChat() {\n  if(currentUtterance) window.speechSynthesis.cancel();\n  stopMouthAnim(); stopLimbAnim(); conversationHistory=[];\n  setRobotState('idle');\n  const greet={\n    en:`Systems reset. I am ${robotName}. How can I assist you?`,\n    te:`రీసెట్ పూర్తయింది. నేను ${robotName}. మీకు ఎలా సహాయపడాలి?`,\n    hi:`रीसेट हो गया। मैं ${robotName}। आपकी कैसे मदद करूं?`\n  };\n  const msg=greet[langChoice]||greet.en;\n  setRobotSpeech(msg); setTimeout(()=>speakResponse(msg),300);\n  notif('info','Reset','AI assistant reinitialized');\n}\n\nfunction aiKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAI();} }\nfunction autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,90)+'px'; }\n\n// ── MIC INPUT\nfunction toggleAiMic() {\n  const btn=document.getElementById('ai-mic-btn');\n  if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){\n    notif('warning','Voice Input','Use Chrome or Edge for voice input'); return;\n  }\n  if(isListening){recognition?.stop();isListening=false;btn.classList.remove('on');return;}\n  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;\n  recognition=new SR();\n  recognition.lang=langCfg[langChoice].code;\n  recognition.continuous=false; recognition.interimResults=false;\n  recognition.onresult=e=>{\n    document.getElementById('ai-ta').value=e.results[0][0].transcript;\n    isListening=false; btn.classList.remove('on');\n    sendAI();\n  };\n  recognition.onend=()=>{isListening=false;btn.classList.remove('on');};\n  recognition.start(); isListening=true; btn.classList.add('on');\n  const vs=document.getElementById('voice-status'); if(vs) vs.textContent='LISTENING…';\n}\n\n// ══════════════════════════════════════════════\n//  IMAGE GENERATION\n// ══════════════════════════════════════════════\nfunction openImgen() {\n  document.getElementById('imgen-modal').classList.remove('hidden');\n  document.getElementById('ig-preview').innerHTML='<div class=\"ig-empty\">Awaiting creative direction…<\u002Fdiv>';\n  document.getElementById('ig-prompt').value='';\n  currentGeneratedImage=null;\n}\nfunction closeImgen(){ document.getElementById('imgen-modal').classList.add('hidden'); }\n\nfunction generateImage() {\n  const p=document.getElementById('ig-prompt').value.trim(); if(!p) return;\n  const el=document.getElementById('ig-preview');\n  el.innerHTML='<div class=\"ig-empty\" style=\"opacity:.4;font-family:var(--mono);font-size:11px;color:rgba(74,158,255,.5);\">Rendering…<\u002Fdiv>';\n  const seed=Date.now();\n  const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=1024&height=1024&nologo=true&seed=${seed}&model=flux`;\n  currentGeneratedImage=url;\n  const img=new Image();\n  img.onload=()=>{\n    el.innerHTML=''; el.appendChild(img);\n    img.style.cssText='width:100%;height:100%;object-fit:cover;';\n    const dl=document.createElement('button');\n    dl.style.cssText='position:absolute;bottom:12px;right:12px;padding:7px 13px;background:rgba(0,0,0,.85);border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-family:var(--mono);font-size:10px;cursor:pointer;';\n    dl.textContent='↓ Download'; dl.onclick=downloadImage; el.appendChild(dl);\n  };\n  img.onerror=()=>{ el.innerHTML='<div class=\"ig-empty\">Generation failed. Try again.<\u002Fdiv>'; };\n  img.src=url;\n}\n\nasync function downloadImage() {\n  if(!currentGeneratedImage) return;\n  try {\n    const res=await fetch(currentGeneratedImage); const blob=await res.blob();\n    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);\n    a.download='nexus-ai-'+Date.now()+'.png'; document.body.appendChild(a); a.click(); a.remove();\n    notif('success','Downloaded','Image saved');\n  } catch { window.open(currentGeneratedImage,'_blank'); }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
